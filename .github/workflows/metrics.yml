name: Metrics
on:
  # Update once a day at 00:00 UTC (a single daily run stays well under API limits)
  schedule: [{ cron: "0 0 * * *" }]
  # Allow manual runs from the Actions tab
  workflow_dispatch:
  # Also refresh when you push to main
  push: { branches: ["main", "master"] }

# lowlighter-style profile: small SVG panels in a 2x2 grid, each committed back here.
#   general.svg (header + 3D calendar)  |  languages.svg (most-used)
#   habits.svg  (activity + habits)      |  achievements.svg
# + optional medias.svg (music + anime) once you provide the values (bottom step).
#
# RATE LIMITS: each step spends GitHub API quota. Running many times within one hour
# exhausts the 5000/h GraphQL budget and later panels render "Unexpected error". The
# daily schedule runs it ONCE, so this is a non-issue normally. If you re-run manually,
# do it at most a couple times per hour.
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # ── Panel TL: General — header + 3D isometric contribution calendar ──
      - name: Panel · general
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: eeshsaxena
          filename: metrics.general.svg
          base: header
          config_timezone: Asia/Kolkata
          plugins_errors_fatal: no
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      # ── Panel TR: Languages — most-used language breakdown ──
      - name: Panel · languages
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: eeshsaxena
          filename: metrics.languages.svg
          base: ""
          config_timezone: Asia/Kolkata
          plugins_errors_fatal: no
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_details: bytes-size, percentage
          plugin_languages_indepth: no
          plugin_languages_analysis_timeout: 15

      # ── Panel BL: Activity & community stats ──
      # (plugin_habits removed: metrics has a known "Cannot destructure 'author'"
      #  bug in the habits chart. The base activity+community block is reliable.)
      - name: Panel · habits
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: eeshsaxena
          filename: metrics.habits.svg
          base: activity, community
          config_timezone: Asia/Kolkata
          plugins_errors_fatal: no

      # ── Panel BR: Recent activity feed ──
      # (Replaced the achievements plugin: metrics queries the sunset "Projects
      #  (classic)" GraphQL API which now returns NOT_FOUND, so achievements is
      #  broken on current metrics. Activity is reliable. Can revisit if patched.)
      - name: Panel · activity
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: eeshsaxena
          filename: metrics.activity.svg
          base: ""
          config_timezone: Asia/Kolkata
          plugins_errors_fatal: no
          plugin_activity: yes
          plugin_activity_limit: 5
          plugin_activity_days: 0
          plugin_activity_filter: all
          plugin_activity_visibility: public

      # ── Optional Panel: Medias — music (Spotify playlist) + anime (AniList) ──
      # ENABLE when you have the values:
      #   1. Paste your PUBLIC Spotify playlist URL into plugin_music_playlist.
      #   2. Create an AniList account, add favorite anime + characters, put the
      #      username in plugin_anilist_user.
      #   3. Uncomment this step. It generates metrics.medias.svg.
      # - name: Panel · medias
      #   uses: lowlighter/metrics@latest
      #   with:
      #     token: ${{ secrets.METRICS_TOKEN }}
      #     user: eeshsaxena
      #     filename: metrics.medias.svg
      #     base: ""
      #     config_timezone: Asia/Kolkata
      #     plugins_errors_fatal: no
      #     # --- Music (Spotify public playlist — no token needed) ---
      #     plugin_music: yes
      #     plugin_music_provider: spotify
      #     plugin_music_mode: playlist
      #     plugin_music_playlist: <PUBLIC_SPOTIFY_PLAYLIST_URL>
      #     plugin_music_limit: 4
      #     # --- Anime / characters (AniList) ---
      #     plugin_anilist: yes
      #     plugin_anilist_user: <ANILIST_USERNAME>
      #     plugin_anilist_medias: anime
      #     plugin_anilist_sections: favorites, characters
      #     plugin_anilist_limit_characters: 22

      # ── Optional Panel: LeetCode stats (add later, per your note) ──
      # - name: Panel · leetcode
      #   uses: lowlighter/metrics@latest
      #   with:
      #     token: ${{ secrets.METRICS_TOKEN }}
      #     user: eeshsaxena
      #     filename: metrics.leetcode.svg
      #     base: ""
      #     plugins_errors_fatal: no
      #     plugin_leetcode: yes
      #     plugin_leetcode_user: eeshsaxena
      #     plugin_leetcode_sections: solved, skills, recent
