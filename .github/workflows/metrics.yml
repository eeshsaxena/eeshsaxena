name: Metrics
on:
  # Update once a day at 00:00 UTC (a single daily run stays well under API limits)
  schedule: [{ cron: "0 0 * * *" }]
  workflow_dispatch:
  push: { branches: ["main", "master"] }

# Every graphic here is generated by YOUR OWN workflow and committed to THIS repo as an
# .svg file. Nothing on the profile depends on a third-party service (no external cards),
# so no one else's uptime can break your profile.
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # ── Panel: General (header) ──
      - name: Panel · general
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: eeshsaxena
          filename: metrics.general.svg
          base: header
          config_timezone: Asia/Kolkata
          plugins_errors_fatal: no

      # ── Panel: Activity & community stats + notable contributions ──
      - name: Panel · stats
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: eeshsaxena
          filename: metrics.stats.svg
          base: activity, community
          config_timezone: Asia/Kolkata
          plugins_errors_fatal: no
          plugin_notable: yes
          plugin_notable_from: all
          plugin_notable_repositories: yes
          extras_css: |
            .row.organization.contributions > *:nth-child(n+9) { display: none; }
            .organization.contribution { border-color: #ffffff !important; background-color: #ffffff1a !important; }

      # ── Panel: Starred topics (icons + labels) ──
      - name: Panel · topics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: eeshsaxena
          filename: metrics.topics.svg
          base: ""
          plugins_errors_fatal: no
          plugin_topics: yes
          plugin_topics_mode: starred
          plugin_topics_sort: stars
          plugin_topics_limit: 20

      # ── Panel: Recently starred repositories ──
      - name: Panel · stars
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: eeshsaxena
          filename: metrics.stars.svg
          base: ""
          plugins_errors_fatal: no
          plugin_stars: yes
          plugin_stars_limit: 4

      # NOTE: two of the four requested panels are disabled because metrics @latest can't
      # render them for this account:
      #   - Coding habits (plugin_habits): crashes with "Cannot destructure property 'author'"
      #     (a metrics bug, same class as achievements/activity/languages).
      #   - Repository licenses (plugin_licenses): renders empty; needs a per-repo dependency
      #     install that the plugin doesn't reliably pick up. Can be revisited.

      # ── Panel: Anime (AniList favorites + favorite characters) ──
      # Spotify music is shown via a static playlist card in README.md (the metrics
      # music plugin crashes scraping Spotify's embed page).
      - name: Panel · anime
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: eeshsaxena
          filename: metrics.medias.svg
          base: ""
          plugins_errors_fatal: no
          plugin_anilist: yes
          plugin_anilist_user: eeshu13
          plugin_anilist_medias: anime
          plugin_anilist_sections: favorites, characters
          plugin_anilist_limit_characters: 22

      # ── Panel: Music — recently played (Last.fm, scrobbled from Spotify) ──
      - name: Panel · music
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: eeshsaxena
          filename: metrics.music.svg
          base: ""
          plugins_errors_fatal: no
          plugin_music: yes
          plugin_music_provider: lastfm
          plugin_music_token: ${{ secrets.LASTFM_TOKEN }}
          plugin_music_user: eeshsaxena
          plugin_music_mode: recent
          plugin_music_limit: 4

      # ── Optional Panel: LeetCode stats (add when you want) ──
      # - name: Panel · leetcode
      #   uses: lowlighter/metrics@latest
      #   with:
      #     token: ${{ secrets.METRICS_TOKEN }}
      #     user: eeshsaxena
      #     filename: metrics.leetcode.svg
      #     base: ""
      #     plugins_errors_fatal: no
      #     plugin_leetcode: yes
      #     plugin_leetcode_user: eeshsaxena
      #     plugin_leetcode_sections: solved, skills, recent
