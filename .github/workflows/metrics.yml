name: Metrics
on:
  # Update once a day at 00:00 UTC (a single daily run stays well under API limits)
  schedule: [{ cron: "0 0 * * *" }]
  workflow_dispatch:
  push: { branches: ["main", "master"] }

# lowlighter-style panels committed back to this repo and embedded by README.md.
# NOTE: metrics @latest currently has broken plugins (languages -> "0 languages",
# activity -> "Cannot read undefined", achievements -> sunset Projects-classic API).
# Those are metrics bugs (the token reads all data fine), so only the reliable panels
# are enabled here. Languages is shown via github-readme-stats in the README instead.
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # ── Panel: General (header only) ──
      # (isocalendar / 3D contribution calendar removed at user request; that also
      #  removed the commit-streak and commits-per-day stats it carried.)
      - name: Panel · general
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: eeshsaxena
          filename: metrics.general.svg
          base: header
          config_timezone: Asia/Kolkata
          plugins_errors_fatal: no

      # ── Panel: Activity & community stats ──
      - name: Panel · habits
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: eeshsaxena
          filename: metrics.habits.svg
          base: activity, community
          config_timezone: Asia/Kolkata
          plugins_errors_fatal: no
          # Top repositories / orgs eeshsaxena has notably contributed to
          plugin_notable: yes
          plugin_notable_from: all
          plugin_notable_repositories: yes
          # Show only the top 8 notable pills, and recolor their borders (tokyonight purple)
          extras_css: |
            .row.organization.contributions > *:nth-child(n+9) { display: none; }
            .organization.contribution { border-color: #bb9af7 !important; background-color: #bb9af71a !important; }

      # ── Panel: Anime (AniList favorites + favorite characters) ──
      # Spotify music was REMOVED from this panel: the metrics music plugin crashes
      # while scraping Spotify's embed page (getComputedStyle bug, music/index.mjs:129).
      # Music is shown instead via a static Spotify playlist card in README.md.
      - name: Panel · anime
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: eeshsaxena
          filename: metrics.medias.svg
          base: ""
          plugins_errors_fatal: no
          plugin_anilist: yes
          plugin_anilist_user: eeshu13
          plugin_anilist_medias: anime
          plugin_anilist_sections: favorites, characters
          plugin_anilist_limit_characters: 22

      # ── Optional Panel: LeetCode stats (add when you want) ──
      # - name: Panel · leetcode
      #   uses: lowlighter/metrics@latest
      #   with:
      #     token: ${{ secrets.METRICS_TOKEN }}
      #     user: eeshsaxena
      #     filename: metrics.leetcode.svg
      #     base: ""
      #     plugins_errors_fatal: no
      #     plugin_leetcode: yes
      #     plugin_leetcode_user: eeshsaxena
      #     plugin_leetcode_sections: solved, skills, recent
