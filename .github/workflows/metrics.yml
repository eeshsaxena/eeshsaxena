name: Metrics
on:
  # Update once a day at 00:00 UTC (a single daily run stays well under API limits)
  schedule: [{ cron: "0 0 * * *" }]
  workflow_dispatch:
  push: { branches: ["main", "master"] }

# lowlighter-style panels committed back to this repo and embedded by README.md.
# NOTE: metrics @latest currently has broken plugins (languages -> "0 languages",
# activity -> "Cannot read undefined", achievements -> sunset Projects-classic API).
# Those are metrics bugs (the token reads all data fine), so only the reliable panels
# are enabled here. Languages is shown via github-readme-stats in the README instead.
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # ── Panel: General (header + 3D isometric contribution calendar) ──
      - name: Panel · general
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: eeshsaxena
          filename: metrics.general.svg
          base: header
          config_timezone: Asia/Kolkata
          plugins_errors_fatal: no
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      # ── Panel: Activity & community stats ──
      - name: Panel · habits
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: eeshsaxena
          filename: metrics.habits.svg
          base: activity, community
          config_timezone: Asia/Kolkata
          plugins_errors_fatal: no

      # ── Panel: Medias (anime via AniList favorites + music via Spotify playlist) ──
      # Music renders from the public playlist URL alone (no Spotify token needed).
      # Anime section stays blank until favorite anime + characters are added on
      # the AniList profile (eeshu13); add them, then the next run fills it in.
      - name: Panel · medias
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: eeshsaxena
          filename: metrics.medias.svg
          base: ""
          plugins_errors_fatal: no
          plugin_anilist: yes
          plugin_anilist_user: eeshu13
          plugin_anilist_medias: anime
          plugin_anilist_sections: favorites, characters
          plugin_anilist_limit_characters: 22
          plugin_music: yes
          plugin_music_provider: spotify
          plugin_music_mode: playlist
          # NOTE: the music plugin requires the EMBED url form (/embed/playlist/...),
          # not the plain share link, or it errors "Unsupported playlist URL format".
          plugin_music_playlist: https://open.spotify.com/embed/playlist/2onMt7L0ZWid8Sto2VO7H2
          plugin_music_limit: 4

      # ── Optional Panel: LeetCode stats (add when you want) ──
      # - name: Panel · leetcode
      #   uses: lowlighter/metrics@latest
      #   with:
      #     token: ${{ secrets.METRICS_TOKEN }}
      #     user: eeshsaxena
      #     filename: metrics.leetcode.svg
      #     base: ""
      #     plugins_errors_fatal: no
      #     plugin_leetcode: yes
      #     plugin_leetcode_user: eeshsaxena
      #     plugin_leetcode_sections: solved, skills, recent
